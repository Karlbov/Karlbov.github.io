# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Karl Bovenizer  
description: "Hello, my name is Karl Bovenizer, and I am currently transitioning from a career in veterinary and coaching to Data scientist, bringing a unique outlook and skill set to the basis of Data Analysis"
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Northumberland, UK"
resume_url: /docs/Karl_Bovenizer_CV_Industry.docx
avatar_image: /img/Headshot.JPEG

#-------------------------------
# Contact links
linkedln: "www.linkedin.com/in/karlbovenizer" # Add your linkedln handle
github: "https://github.com/Karlbov"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


